[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misinformation-diffusion"
version = "1.1.0"
description = "Reproducible information diffusion experiments on random, scale-free, and small-world networks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["networkx>=3.4,<4", "numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "pandas>=2.2,<4"]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "nbformat>=5", "nbclient>=0.10"]

[project.scripts]
misinformation-study = "analysis.experiment:main"

[tool.setuptools.packages.find]
include = ["simulations*", "analysis*"]
