name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_paper.py --check
      - run: misinformation-study --nodes 60 --runs 3 --graphs 2 --points 5 --clustering --output /tmp/study-smoke
        env:
          MPLBACKEND: Agg
